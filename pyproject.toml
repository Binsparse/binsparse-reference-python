[project]
authors = [{name = "Willow Ahrens", email = "ahrens@gatech.edu"}]
dependencies = []
name = "binsparse"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
binsparse = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
h5py = ">=3.16.0,<4"
numpy = ">=2.5.2,<3"
dlpack = ">=1.3,<2"
