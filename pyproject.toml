[project]
authors = [{name = "Willow Ahrens", email = "ahrens@gatech.edu"}]
name = "binsparse"
requires-python = ">= 3.11"
version = "0.1.1"
dependencies = [
    "h5py>=3.16.0,<4",
    "numpy>=2,<3",
    "semver>=3,<4",
]

[project.optional-dependencies]
scipy = ["scipy"]
torch = ["torch"]
sparse = ["sparse"]
conversions = ["scipy", "torch", "sparse"]

[dependency-groups]
test = [
    "hypothesis>=6.165.10,<7",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.15,<2",
    "scipy",
    "sparse",
    "zarr>=3.3.0,<4",
]
pre-commit = [
    "pre-commit>=3.6.0,<5",
]
benchmark = [
    "pytest-codspeed>=5",
    {include-group = "test"},
]
docs = [
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-autoapi>=0.4.1",
    "ruff>=0.6.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/binsparse", "src/reference_cli"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-amd64", platform = "linux-64", glibc = "2.34" },
    { name = "linux-arm64", platform = "linux-aarch64", glibc = "2.34" },
    { name = "linux-ppc64", platform = "linux-ppc64le", glibc = "2.34" },
    { name = "macos-arm64", platform = "osx-arm64", macos = "15.0" },
    { name = "win-amd64", platform = "win-64" },
]
preview = ["pixi-build"]
requires-pixi = ">=0.71.0"

[tool.pixi.package]
name = "binsparse"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.*", channels = ["https://prefix.dev/conda-forge"] }

[tool.pixi.package.build.config]
ignore-pypi-mapping = false

[tool.pixi.package.host-dependencies]
hatchling = "*"

[tool.pixi.environments]
test = { features = ["test"], solve-group = "default" }
benchmark = { features = ["test", "benchmark"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
pre-commit = { features = ["pre-commit"], no-default-feature = true }

[tool.pixi.pypi-dependencies]
binsparse = { path = ".", editable = true }

[tool.pixi.feature.pre-commit.dependencies]
python = ">=3.11"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "RUF022", "TID"]
ignore = ["PYI024"]

[tool.mypy]
ignore_missing_imports = true
exclude = []
files = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--doctest-ignore-import-errors",
    "--cov-report=term-missing",
    "--cov=binsparse",
]
testpaths = ["src"]
junit_family = "xunit2"
strict_config = true
strict_markers = true
markers = [
    "npz: tests using the NPZ binary container",
    "zarr: tests using the Zarr binary container",
    "hdf5: tests using the HDF5 binary container",
    "bool_values: generated values use bint8",
    "signed_integer: generated values use a signed integer dtype",
    "unsigned_integer: generated values use an unsigned integer dtype",
    "floating: generated values use a floating dtype",
    "complex_values: generated values use a complex dtype",
    "iso: generated values use an iso dtype",
]

[tool.pixi.feature.test.tasks.test]
args = [
    { arg = "njobs", default = "logical" },
]
depends-on = [
    { task = "type-check", environment = "test", args = [] },
    { task = "test-only", args = ["{{ njobs }}"] },
]

[tool.pixi.feature.test.tasks.test-only]
cmd = "pytest -m 'not c_backend and not mlir_backend' -n {{ njobs }}"
args = [
    { arg = "njobs", default = "logical" },
]
default-environment = "test"

[tool.pixi.feature.benchmark.tasks.benchmark]
cmd = "pytest --codspeed benchmarks/"
default-environment = "benchmark"

[tool.pixi.feature.test.tasks.type-check]
cmd = "python -m mypy"
default-environment = "test"

[tool.pixi.feature.test.tasks.compliance-reference]
cmd = "pytest -n logical --skips-file compliance-skips/reference.txt --override-ini addopts= .pixi/binsparse-tests/binsparse_tests/test_executables.py"
env = { BINSPARSE_BIN = "$PIXI_PROJECT_ROOT/bin" }
default-environment = "test"
depends-on = ["compliance-suite"]

[tool.pixi.feature.test.tasks.compliance-numpy]
cmd = "pytest -n logical --skips-file compliance-skips/numpy.txt --override-ini addopts= .pixi/binsparse-tests/binsparse_tests/test_executables.py"
env = { NPY_TO_BINSPARSE = "python -m reference_cli.framework numpy npy_to_binsparse", BINSPARSE_TO_NPY = "python -m reference_cli.framework numpy binsparse_to_npy", BINSPARSE_TO_BINSPARSE = "python -m reference_cli.framework numpy binsparse_to_binsparse" }
default-environment = "test"
depends-on = ["compliance-suite"]

[tool.pixi.feature.test.tasks.compliance-scipy]
cmd = "pytest -n logical --skips-file compliance-skips/scipy.txt --override-ini addopts= .pixi/binsparse-tests/binsparse_tests/test_executables.py"
env = { NPY_TO_BINSPARSE = "python -m reference_cli.framework scipy npy_to_binsparse", BINSPARSE_TO_NPY = "python -m reference_cli.framework scipy binsparse_to_npy", BINSPARSE_TO_BINSPARSE = "python -m reference_cli.framework scipy binsparse_to_binsparse" }
default-environment = "test"
depends-on = ["compliance-suite"]

[tool.pixi.feature.test.tasks.compliance-sparse]
cmd = "pytest -n logical --skips-file compliance-skips/sparse.txt --override-ini addopts= .pixi/binsparse-tests/binsparse_tests/test_executables.py"
env = { NPY_TO_BINSPARSE = "python -m reference_cli.framework sparse npy_to_binsparse", BINSPARSE_TO_NPY = "python -m reference_cli.framework sparse binsparse_to_npy", BINSPARSE_TO_BINSPARSE = "python -m reference_cli.framework sparse binsparse_to_binsparse" }
default-environment = "test"
depends-on = ["compliance-suite"]

[tool.pixi.feature.test.tasks.compliance-suite]
cmd = "sh -c 'test -d .pixi/binsparse-tests/.git || git clone --depth 1 https://github.com/Binsparse/binsparse-tests.git .pixi/binsparse-tests'"
default-environment = "test"

[tool.pixi.feature.test.tasks.compliance]
depends-on = [
    "compliance-reference",
    "compliance-numpy",
    "compliance-scipy",
    "compliance-sparse",
]

[tool.pixi.feature.docs.tasks.serve-docs]
cmd = "mkdocs serve --strict"
default-environment = "docs"

[tool.pixi.feature.docs.tasks.build-docs]
cmd = "mkdocs build --strict"
default-environment = "docs"
